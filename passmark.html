    <h2>Grafic Performanță GPU</h2>

    <div style="width: 800px; margin: 40px auto;">
        <canvas id="gpuBarChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx = document.getElementById('gpuBarChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [
                    "RTX 5090",
                    "RTX 5080",
                    "RTX 5070 Ti",
                    "RTX 5070",
                    "RTX 5060 Ti",
                    "RTX 5060",
                    "RTX 5050",
                    "Intel Arc 580",
                    "RX 9070 XT",
                    "RX 9070",
                    "RX 9060 XT"
                ],
                datasets: [{
                    label: 'Performanță (index)',
                    data: [
                        38958,
                        35700,
                        28739,
                        32415,
                        22635,
                        20776,
                        17110,
                        12042,
                        26908,
                        25409,
                        20117
                    ],
                    backgroundColor: [
                        "#7b68ee"
                    ],
                    borderColor: "white",
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: {
                            color: "white"
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: "white" },
                        grid: { color: "rgba(255,255,255,0.15)" }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: "white" },
                        grid: { color: "rgba(255,255,255,0.15)" }
                    }
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="chart.js"></script>
